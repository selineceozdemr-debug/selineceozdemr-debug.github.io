<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000000;
            color: #00ffbb;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        /* TERMINAL YAZISI */

        #terminal {
            position: absolute;

            top: 30px;
            left: 35px;

            width: calc(100% - 70px);

            text-align: left;

            font-family: "Courier New", monospace;
            font-size: 24px;
            line-height: 1.7;

            color: #00ffbb;

            text-shadow:
                0 0 5px #00ffbb,
                0 0 10px #00ffbb;
        }

        #text {
            white-space: pre-wrap;
        }


        /* YANIP SÖNEN İMLEÇ */

        #cursor {
            display: none;

            width: 13px;
            height: 25px;

            background: #00ffbb;

            margin-left: 4px;

            vertical-align: middle;

            animation: blink 0.7s infinite;
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }

        }


        /* ŞİFRE ALANI */

        #passwordArea {
            display: none;

            margin-top: 10px;
        }

        #password {
            background: transparent;

            border: none;
            outline: none;

            color: #00ffbb;

            font-family: "Courier New", monospace;

            font-size: 24px;

            width: 300px;

            caret-color: #00ffbb;

            text-shadow:
                0 0 5px #00ffbb,
                0 0 10px #00ffbb;
        }

        #password::selection {
            background: #00ffbb;
            color: #000000;
        }

    </style>
</head>


<body>


    <!-- TERMINAL -->

    <div id="terminal">

        <span id="text"></span>
        <span id="cursor"></span>

        <div id="passwordArea">

            <input
                id="password"
                type="password"
                autocomplete="off"
                spellcheck="false"
            >

        </div>

    </div>



    <script>

        /*
        ==========================================
        MESAJLAR
        ==========================================
        */

        const messages = [

            "Hoşgeldin Neo...",

            "Ben de seni bekliyordum.",

            "Devam etmek için şifreyi girmelisin..."

        ];


        /*
        ==========================================
        HTML ELEMANLARI
        ==========================================
        */

        const text =
            document.getElementById("text");

        const cursor =
            document.getElementById("cursor");

        const passwordArea =
            document.getElementById("passwordArea");

        const password =
            document.getElementById("password");


        /*
        ==========================================
        YAZI DURUMU
        ==========================================
        */

        let messageIndex = 0;

        let characterIndex = 0;



        /*
        ==========================================
        YAZIYI KARAKTER KARAKTER YAZ
        ==========================================
        */

        function typeMessage() {

            const currentMessage =
                messages[messageIndex];


            /*
            Mesajın tamamı henüz yazılmadıysa
            */

            if (
                characterIndex <
                currentMessage.length
            ) {

                text.textContent +=
                    currentMessage.charAt(
                        characterIndex
                    );


                characterIndex++;


                /*
                Yazma hızı
                */

                setTimeout(
                    typeMessage,
                    120
                );

            }


            /*
            Mesaj tamamen yazıldıysa
            */

            else {


                /*
                Son mesaj
                */

                if (
                    messageIndex ===
                    messages.length - 1
                ) {

                    /*
                    İmleci göster
                    */

                    cursor.style.display =
                        "inline-block";


                    /*
                    Şifre alanını aç
                    */

                    passwordArea.style.display =
                        "block";


                    /*
                    Şifre kutusuna otomatik odaklan
                    */

                    password.focus();

                }


                /*
                İlk iki mesaj
                */

                else {

                    /*
                    3 saniye bekle
                    */

                    setTimeout(
                        deleteMessage,
                        3000
                    );

                }

            }

        }



        /*
        ==========================================
        MESAJI BİR ANDA SİL
        ==========================================
        */

        function deleteMessage() {

            /*
            Harf harf silmek yerine
            tamamını bir anda kaldırıyoruz.
            */

            text.textContent = "";

            characterIndex = 0;


            /*
            Sonraki mesaja geç
            */

            messageIndex++;


            /*
            Yeni mesajdan önce
            kısa bir boşluk
            */

            setTimeout(
                typeMessage,
                500
            );

        }



        /*
        ==========================================
        SAYFA AÇILINCA BAŞLA
        ==========================================
        */

        setTimeout(
            typeMessage,
            1000
        );



        /*
        ==========================================
        ŞİFRE SİSTEMİ
        ==========================================
        */

        password.addEventListener(
            "keydown",
            function(event) {


                /*
                Enter'a basıldı mı?
                */

                if (
                    event.key === "Enter"
                ) {


                    /*
                    Şimdilik test şifresi
                    */

                    const enteredPassword =
                        password.value;


                    if (
                        enteredPassword ===
                        "37"
                    ) {

                        console.log(
                            "ACCESS GRANTED"
                        );


                    }

                    else {

                        console.log(
                            "ACCESS DENIED"
                        );


                        /*
                        Yanlış şifreyi temizle
                        */

                        password.value = "";

                    }

                }

            }
        );

    </script>


</body>
</html>
