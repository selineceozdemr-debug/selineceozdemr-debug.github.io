<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: #000000;
            color: #00ffbb;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        #terminal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 1100px;

            font-size: 24px;
            line-height: 1.7;

            text-shadow:
                0 0 5px #00ffbb,
                0 0 10px #00ffbb;
        }

        #text {
            white-space: pre-wrap;
        }

        /* Son mesajdaki imleç */
        #cursor {
            display: none;

            width: 13px;
            height: 25px;

            background: #00ffbb;

            margin-left: 4px;

            vertical-align: middle;

            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }

            50%, 100% {
                opacity: 0;
            }
        }

        /* Şifre alanı */
        #passwordArea {
            display: none;
            margin-top: 15px;
        }

        #password {
            background: transparent;
            border: none;
            outline: none;

            color: #00ffbb;

            font-family: "Courier New", monospace;
            font-size: 24px;

            width: 300px;

            caret-color: #00ffbb;

            text-shadow:
                0 0 5px #00ffbb,
                0 0 10px #00ffbb;
        }

        #password::selection {
            background: #00ffbb;
            color: #000000;
        }
    </style>
</head>

<body>

    <div id="terminal">

        <span id="text"></span>
        <span id="cursor"></span>

        <div id="passwordArea">
            <input
                id="password"
                type="password"
                autocomplete="off"
                spellcheck="false"
            >
        </div>

    </div>


    <script>

        const text = document.getElementById("text");
        const cursor = document.getElementById("cursor");

        const passwordArea = document.getElementById("passwordArea");
        const password = document.getElementById("password");


        const messages = [
            "Hoşgeldin Neo...",
            "Ben de seni bekliyordum.",
            "Devam etmek için şifreyi girmelisin..."
        ];


        let messageIndex = 0;
        let characterIndex = 0;


        function typeMessage() {

            const currentMessage = messages[messageIndex];


            /* Mesaj tamamen yazılmadıysa */
            if (characterIndex < currentMessage.length) {

                text.textContent += currentMessage[characterIndex];

                characterIndex++;

                setTimeout(typeMessage, 120);

            }


            /* Mesaj tamamen yazıldı */
            else {

                /* Son mesajsa */
                if (messageIndex === messages.length - 1) {

                    setTimeout(() => {

                        cursor.style.display = "inline-block";

                        passwordArea.style.display = "block";

                        password.focus();

                    }, 300);

                }


                /* İlk veya ikinci mesajsa */
                else {

                    setTimeout(() => {

                        deleteMessage();

                    }, 3000);

                }

            }
        }


        function deleteMessage() {

            if (characterIndex > 0) {

                text.textContent =
                    text.textContent.slice(0, -1);

                characterIndex--;

                setTimeout(deleteMessage, 45);

            }

            else {

                messageIndex++;

                setTimeout(typeMessage, 500);

            }
        }


        /* Site açıldıktan sonra biraz bekle */
        setTimeout(typeMessage, 1000);


        /*
            Şimdilik test şifresi.
            Daha sonra bunu defterde çözülen gerçek
            şifreyle değiştireceğiz.
        */

        password.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                const enteredPassword = password.value;

                if (enteredPassword === "37") {

                    console.log("ACCESS GRANTED");

                }

                else {

                    console.log("ACCESS DENIED");

                    password.value = "";

                }

            }

        });

    </script>

</body>
</html>
