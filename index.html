<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: #00ff41;
            font-family: "Courier New", monospace;
            overflow: hidden;
        }

        #terminal {
            padding: 35px;
            font-size: 20px;
            line-height: 1.6;
            text-shadow:
                0 0 5px #00ff41,
                0 0 10px #00ff41;
        }

        #cursor {
            display: inline-block;
            width: 10px;
            height: 22px;
            background: #00ff41;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #passwordScreen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #passwordScreen h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        #password {
            background: transparent;
            border: none;
            border-bottom: 1px solid #00ff41;
            outline: none;
            color: #00ff41;
            font-family: "Courier New", monospace;
            font-size: 20px;
            text-align: center;
            padding: 10px;
            width: 280px;
        }

        #password::placeholder {
            color: #075d1d;
        }

        #enter {
            margin-top: 20px;
            background: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 8px 25px;
            font-family: "Courier New", monospace;
            cursor: pointer;
        }

        #enter:hover {
            background: #00ff41;
            color: #000;
        }

        #wrong {
            margin-top: 20px;
            height: 20px;
        }
    </style>
</head>

<body>

    <div id="terminal">
        <span id="text"></span><span id="cursor"></span>
    </div>

    <div id="passwordScreen">

        <h1>ŞİFRE GEREKLİ</h1>

        <input
            id="password"
            type="password"
            placeholder="..."
        >

        <button id="enter">GİR</button>

        <div id="wrong"></div>

    </div>

    <script>

        const lines = [
            "> CONNECTION ESTABLISHED",
            "> SEARCHING...",
            "> USER FOUND",
            "",
            "> HOŞGELDİN NEO"
        ];

        const text = document.getElementById("text");
        const cursor = document.getElementById("cursor");
        const terminal = document.getElementById("terminal");
        const passwordScreen = document.getElementById("passwordScreen");

        let line = 0;
        let character = 0;

        function typeWriter() {

            if (line >= lines.length) {

                setTimeout(() => {

                    terminal.style.display = "none";
                    passwordScreen.style.display = "flex";

                }, 1800);

                return;
            }

            if (character < lines[line].length) {

                text.textContent += lines[line].charAt(character);

                character++;

                setTimeout(typeWriter, 70);

            } else {

                text.textContent += "\n";

                line++;
                character = 0;

                setTimeout(typeWriter, 500);
            }
        }

        setTimeout(typeWriter, 1000);


        const passwordInput = document.getElementById("password");
        const enterButton = document.getElementById("enter");
        const wrong = document.getElementById("wrong");

        function checkPassword() {

            const password = passwordInput.value;

            if (password === "37") {

                wrong.textContent = "ACCESS GRANTED";

            } else {

                wrong.textContent = "ACCESS DENIED";
                passwordInput.value = "";

            }
        }

        enterButton.addEventListener("click", checkPassword);

        passwordInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                checkPassword();
            }

        });

    </script>

</body>
</html>
